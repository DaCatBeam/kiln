---
- name: Set Pre-Flight Facts
  ansible.builtin.set_fact:
    kernel_modules_cis_level_1_filesystem_blacklist:
      - cramfs
      - freevxfs
      - hfs
      - hfsplus
      - jffs2
    kernel_modules_cis_level_2_filesystem_blacklist:
      - overlay
      - squashfs
      - udf
      - firewire-core
      - usb-storage
    kernel_modules_cis_level_1_network_blacklist:
      - atm
      - can
      - dccp
      - rds
      - sctp
      - tipc
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Ensure Blacklist for CIS Level 1 Filesystem Kernel Modules
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: "{{ kernel_modules_modprobe_directory_path }}/{{ kernel_modules_modprobe_conf_prefix }}-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ kernel_modules_cis_level_1_filesystem_blacklist | difference(kernel_modules_filesystem_blacklist_exclusions) }}
  loop_control:
    label: "{{ item }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Ensure Blacklist for CIS Level 2 Filesystem Kernel Modules
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: "{{ kernel_modules_modprobe_directory_path }}/{{ kernel_modules_modprobe_conf_prefix }}-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ kernel_modules_cis_level_2_filesystem_blacklist | difference(kernel_modules_filesystem_blacklist_exclusions) }}
  loop_control:
    label: "{{ item }}"
  tags:
    - cis_level_2_baseline

- name: Ensure Blacklist for CIS Level 1 Network Kernel Modules
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: "{{ kernel_modules_modprobe_directory_path }}/{{ kernel_modules_modprobe_conf_prefix }}-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ kernel_modules_cis_level_1_network_blacklist | difference(kernel_modules_network_blacklist_exclusions) }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline
