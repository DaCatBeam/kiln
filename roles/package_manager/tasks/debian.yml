---
- name: Discover APT Conf Directory
  ansible.builtin.stat:
    path: "{{ package_manager_apt_conf_directory_path }}"
  register: package_manager_apt_conf_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Conf Directory.
    Ensure APT Conf Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: "{{ package_manager_apt_conf_directory_path }}"
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_conf_directory.stat.mode
        if (
          package_manager_apt_conf_directory.stat.mode is defined
          and
          package_manager_apt_conf_directory.stat.mode
            is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Conf File Disabling Weak Dependencies
  ansible.builtin.stat:
    path: "{{ package_manager_apt_conf_directory_path }}/{{ package_manager_apt_conf_disable_weak_deps_file_name }}"
  register: package_manager_apt_conf_disable_weak_deps_file
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Disable APT Installation of Weak Dependencies
  ansible.builtin.copy:
    src: files/99-kiln-disable-weak-deps
    dest: "{{ package_manager_apt_conf_directory_path }}/{{ package_manager_apt_conf_disable_weak_deps_file_name }}"
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_conf_disable_weak_deps_file.stat.mode
        if (
          package_manager_apt_conf_disable_weak_deps_file.stat.mode is defined
          and
          package_manager_apt_conf_disable_weak_deps_file.stat.mode
            is ansible.builtin.match("^0[0246][04][04]$")
        )
        else "0644"
      }}
  tags:
    - cis_level_2_baseline

- name: Discover APT Source List Directory
  ansible.builtin.stat:
    path: "{{ package_manager_apt_source_list_directory_path }}"
  register: package_manager_apt_source_list_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Source List Directory.
    Ensure Apt Source List Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: "{{ package_manager_apt_source_list_directory_path }}"
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_source_list_directory.stat.mode
        if (
          package_manager_apt_source_list_directory.stat.mode is defined
          and
          package_manager_apt_source_list_directory.stat.mode
            is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Source List Files
  ansible.builtin.find:
    paths: "{{ package_manager_apt_source_list_directory_path }}"
    patterns:
      - "*.list"
      - "*.sources"
    recurse: true
    file_type: file
  register: package_manager_apt_source_list_files
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Source List Files.
    Ensure APT Source List Files Are 0644 or More Restrictive.
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: >-
      {{
        item.mode
        if (
          item.mode is defined
          and
          item.mode is ansible.builtin.match("^0[0246][04][04]$")
        )
        else "0644"
      }}
  loop: "{{ package_manager_apt_source_list_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Trusted GPG Directory
  ansible.builtin.stat:
    path: /etc/apt/trusted.gpg.d
  register: package_manager_apt_trusted_gpg_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Trusted GPG Directory.
    Ensure APT Trusted GPG Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_trusted_gpg_directory.stat.mode
        if (
          package_manager_apt_trusted_gpg_directory.stat.mode is defined
          and
          package_manager_apt_trusted_gpg_directory.stat.mode
            is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover Shared Keyrings Directory
  ansible.builtin.stat:
    path: /usr/share/keyrings
  register: package_manager_shared_keyrings_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For Shared Keyrings Directory.
    Ensure Shared Keyrings Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_shared_keyrings_directory.stat.mode
        if (
          package_manager_shared_keyrings_directory.stat.mode is defined
          and
          package_manager_shared_keyrings_directory.stat.mode is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Read APT Source And List File Contents
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ package_manager_apt_source_list_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: package_manager_apt_source_configuration_contents
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Initialize Discovered Signed-By Key Paths
  ansible.builtin.set_fact:
    package_manager_apt_signed_by_key_paths: []
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Collect signed-by/Signed-By Key Paths
  vars:
    package_manager_apt_source_content: "{{ item.content | ansible.builtin.b64decode }}"

    # Matches modern 1 line list entries
    #
    # ex: deb [signed-by=/etc/apt/keyrings/vendor.gpg,/etc/apt/keyrings/vendor2.gpg]
    # yamllint disable rule:line-length
    package_manager_apt_list_signed_by_values: >-
      {{
        package_manager_apt_source_content
        | ansible.builtin.regex_findall(
            '(?im)^[ \t]*(?!#)deb(?:-src)?[ \t]+\[[^\]\n]*\bsigned-by[ \t]*=[ \t]*([^\]\s]+(?:[ \t]*,[ \t]*[^\]\s]+)*)[^\]\n]*\]'
          )
      }}
    # yamllint enable rule:line-length

    # Matches sources field
    #
    # ex1: Signed-By: /etc/apt/keyrings/vendor.gpg
    # ex2: Signed-By:
    #       /etc/apt/keyrings/vendor.gpg
    #       /etc/apt/keyrings/vendor2.gpg
    package_manager_apt_sources_signed_by_values: >-
      {{
        package_manager_apt_source_content
        | ansible.builtin.regex_findall(
            "(?ims)^[ \t]*Signed-By[ \t]*:[ \t]*(.*?)(?=^[^ \t#\r\n][^:\r\n]*:|^[ \t]*$|\Z)"
          )
      }}

    # Reject files with embedded public keys
    package_manager_apt_file_backed_signed_by_values: >-
      {{
        (package_manager_apt_list_signed_by_values + package_manager_apt_sources_signed_by_values)
        | reject("search", "-----BEGIN PGP PUBLIC KEY BLOCK-----")
        | list
      }}

    package_manager_apt_signed_by_paths_from_file: >-
      {{
        package_manager_apt_file_backed_signed_by_values
        | map("ansible.builtin.regex_findall", "/[^,\s\]]+")
        | ansible.builtin.flatten
        | list
      }}

  ansible.builtin.set_fact:
    package_manager_apt_signed_by_key_paths: >-
      {{ package_manager_apt_signed_by_key_paths + package_manager_apt_signed_by_paths_from_file }}
  loop: "{{ package_manager_apt_source_configuration_contents.results }}"
  loop_control:
    label: "{{ item.source }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Deduplicate Discovered Signed-By Key Paths
  ansible.builtin.set_fact:
    package_manager_apt_signed_by_key_paths: "{{ package_manager_apt_signed_by_key_paths | unique | sort | list }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Inspect Signed-By Key Files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ package_manager_apt_signed_by_key_paths }}"
  loop_control:
    label: "{{ item }}"
  register: package_manager_apt_signed_by_key_file_stats

- name: Report Missing Signed-By Key Files
  ansible.builtin.debug:
    msg: >-
      APT source configuration references a missing Signed-By key:
      {{ item.item }}
  loop: "{{ package_manager_apt_signed_by_key_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not item.stat.exists
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Sources List Files That Include Signed-By.
    Ensure APT Sources List Files That Include Signed-By Are 0644 Or More Restrictive.
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: file
    owner: root
    group: root
    mode: >-
      {{
        item.stat.mode
        if (
          item.stat.mode is defined
          and
          item.stat.mode
            is ansible.builtin.match("^0[0246][04][04]$")
        )
        else "0644"
      }}
  loop: "{{ package_manager_apt_signed_by_key_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.isreg | default(false)
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Trusted GPG Keys
  ansible.builtin.find:
    paths:
      - /etc/apt/trusted.gpg.d
      - /usr/share/keyrings
    patterns:
      - "*.gpg"
    recurse: true
    file_type: file
  register: package_manager_apt_trusted_gpg_files
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Trusted GPG Keys.
    Ensure APT Trusted GPG Keys are 0644 or More Restrictive.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: root
    group: root
    mode: >-
      {{
        item.mode
        if (
          item.mode is defined
          and
          item.mode is ansible.builtin.match("^0[0246][04][04]$")
        )
        else "0644"
      }}
  loop: "{{ package_manager_apt_trusted_gpg_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Auth Conf Directory
  ansible.builtin.stat:
    path: "{{ package_manager_apt_auth_conf_directory_path }}"
  register: package_manager_apt_auth_conf_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Auth Conf Directory.
    Ensure APT Auth Conf Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: "{{ package_manager_apt_auth_conf_directory_path }}"
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_auth_conf_directory.stat.mode
        if (
          package_manager_apt_auth_conf_directory.stat.mode is defined
          and
          package_manager_apt_auth_conf_directory.stat.mode
            is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Auth Conf Files
  ansible.builtin.find:
    paths: "{{ package_manager_apt_auth_conf_directory_path }}"
    patterns: "*.conf"
    recurse: true
    file_type: file
  register: package_manager_apt_auth_conf_files
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Ensure APT Auth Conf Files Are 0640 or More Restrictive
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: >-
      {{
        item.mode
        if (
          item.mode is defined
          and
          item.mode is ansible.builtin.match("^0[0246][04][0]$")
        )
        else "0640"
      }}
  loop: "{{ package_manager_apt_auth_conf_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline
