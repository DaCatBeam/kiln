---
- name: Discover APT Conf Directory
  ansible.builtin.stat:
    path: "{{ package_manager_apt_conf_directory_path }}"
  register: package_manager_apt_conf_directory
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: |
    Ensure Root File Ownership For APT Conf Directory.
    Ensure APT Conf Directory is 0755 or More Restrictive.
  ansible.builtin.file:
    path: "{{ package_manager_apt_conf_directory_path }}"
    state: directory
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_conf_directory.stat.mode
        if (
          package_manager_apt_conf_directory.stat.mode is defined
          and
          package_manager_apt_conf_directory.stat.mode
            is ansible.builtin.match("^0[0-7][0145][0145]$")
        )
        else "0755"
      }}
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Discover APT Conf File Disabling Weak Dependencies
  ansible.builtin.stat:
    path: "{{ package_manager_apt_conf_directory_path }}/{{ package_manager_apt_conf_disable_weak_deps_file_name }}"
  register: package_manager_apt_conf_disable_weak_deps_file
  tags:
    - cis_level_1_baseline
    - cis_level_2_baseline

- name: Disable APT Installation of Weak Dependencies
  ansible.builtin.copy:
    src: 99-kiln-disable-weak-deps
    dest: "{{ package_manager_apt_conf_directory_path }}/{{ package_manager_apt_conf_disable_weak_deps_file_name }}"
    owner: root
    group: root
    mode: >-
      {{
        package_manager_apt_conf_disable_weak_deps_file.stat.mode
        if (
          package_manager_apt_conf_disable_weak_deps_file.stat.mode is defined
          and
          package_manager_apt_conf_disable_weak_deps_file.stat.mode
            is ansible.builtin.match("^0[0246][04][04]$")
        )
        else "0644"
      }}
  tags:
    - cis_level_2_baseline
