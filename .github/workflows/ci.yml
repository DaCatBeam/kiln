---
name: ci
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      VAGRANT_DEFAULT_PROVIDER: virtualbox
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.11

      - name: Install Python Deps
        run: pip install -r requirements-dev.txt;

      - name: MAKE Sure `Make` Is Installed
        run: sudo apt install -y make;

      # yamllint disable rule:line-length
      - name: Install Virtualbox and Vagrant
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg;
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt update;
          sudo apt-get install --yes --no-install-recommends \
            "linux-headers-$(uname -r)" \
            virtualbox \
            vagrant;

          # Workaround Load KVM Module
          echo "Loaded KVM modules before cleanup:"
          lsmod | grep '^kvm' || true

          if lsmod | grep -q '^kvm_amd'; then
            sudo modprobe --remove kvm_amd
          fi

          echo "Loaded KVM modules after cleanup:"
          lsmod | grep '^kvm' || true

          sudo modprobe vboxdrv;

          VBoxManage --version;
          command -v VBoxHeadless;
          vagrant --version;
      # yamllint enable rule:line-length

      - name: Install Dependencies For Test Scripts
        run: |
          # Install GPG for fixture generation.
          sudo apt install -y gnupg;

      - name: Run Linter
        run: make run-linter;

      - name: Run Molecule Tests
        run: |
          make run-debian-tests;
          make run-ubuntu-tests;
