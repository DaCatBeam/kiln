---
name: PR Comment Event
on: # yamllint disable-line rule:truthy
  issue_comment:
    types:
      - created

concurrency:
  group: rerun-ci-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  actions: write
  pull-requests: read

jobs:
  rerun-ci:
    name: Rerun CI
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'Github do CI') &&
      (
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find CI run for pull request
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail

          head_sha="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha'
          )"

          run_id="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs" \
              -f head_sha="${head_sha}" \
              -f event="pull_request" \
              -f status="completed" \
              -f per_page="1" \
              --jq '.workflow_runs[0].id // empty'
          )"

          if [[ -z "${run_id}" ]]; then
            echo "::error::No completed CI run found for commit ${head_sha}"
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Rerun CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci-run.outputs.run_id }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun"

          echo "Requested rerun of workflow run ${RUN_ID}"
